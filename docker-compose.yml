services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    network_mode: host
    environment:
      KAIROS_AI_URL: http://127.0.0.1:8080/v1/chat/completions
      KAIROS_AI_MODEL: Qwen3-4B-Q4_K_M.gguf
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
